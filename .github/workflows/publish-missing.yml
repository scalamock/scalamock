name: Publish missing artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish the scalatest/specs2 modules under (e.g. 7.6.0)"
        required: true
        default: "7.6.0"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # sbt-dynver derives the version from the nearest tag. Move the tag onto the
      # checked-out commit locally (never pushed) so the modules whose artifact ids
      # were wrong in that release get re-published under exactly the same version.
      - run: git tag -f "v${{ inputs.version }}"
      - uses: actions/setup-java@v4
        with:
          java-version: 17.0.21
          check-latest: true
          distribution: 'temurin'
          cache: sbt
      - name: Verify Java trust store
        shell: bash
        run: |
          # Temurin reissued some builds under the same version; reject stale cached stores.
          certs="$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -v -cacerts -storepass changeit)"
          if printf '%s\n' "$certs" | grep -Ei '^Owner:.*(emSign (ECC Root CA - G3|Root CA - G2)|AAA Certificate Services)' > /dev/null; then
            echo "Compromised eMudhra trust path remains in the JDK" >&2
            exit 1
          fi
      - uses: sbt/setup-sbt@v1
      # Only scalamock-scalatest, scalamock-specs2-4 and scalamock-specs2-5 are
      # published here: every other module already exists on Maven Central under
      # the correct id for this version, and Maven Central rejects duplicates.
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          # sbt-ci-release decides "is this a tag push?" from CI_COMMIT_TAG/GITHUB_REF,
          # not from git tags. workflow_dispatch runs on a branch ref
          # (GITHUB_REF=refs/heads/...), so without this it silently no-ops with
          # "Snapshot releases must have -SNAPSHOT version number, doing nothing".
          CI_COMMIT_TAG: v${{ inputs.version }}
          CI_RELEASE: >-
            ; ++2.12.21
            ; scalamock-specs2-4JVM/publishSigned ; scalamock-specs2-4JS/publishSigned
            ; scalamock-scalatestJVM/publishSigned ; scalamock-scalatestJS/publishSigned
            ; ++2.13.18
            ; scalamock-specs2-4JVM/publishSigned ; scalamock-specs2-4JS/publishSigned
            ; scalamock-scalatestJVM/publishSigned ; scalamock-scalatestJS/publishSigned
            ; ++3.9.0
            ; scalamock-specs2-4JVM/publishSigned ; scalamock-specs2-4JS/publishSigned ; scalamock-specs2-4Native/publishSigned
            ; scalamock-specs2-5JVM/publishSigned ; scalamock-specs2-5JS/publishSigned ; scalamock-specs2-5Native/publishSigned
            ; scalamock-scalatestJVM/publishSigned ; scalamock-scalatestJS/publishSigned ; scalamock-scalatestNative/publishSigned
