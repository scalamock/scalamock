name: SBT CI Build

on:
  push:
    branches: [ series/7.x ]
  pull_request:
    branches: [ series/7.x ]

jobs:
  scala_2_12:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 17.0.21+9
        force-download: true
        distribution: 'temurin'
    - uses: sbt/setup-sbt@v1
    - name: Run tests
      # Scala Native is Scala 3 only (crossScalaVersions is pinned to 3.x for
      # the .native projects), so plain `test` on the aggregated root project
      # would also re-run those modules' Scala 3 tests here, duplicating the
      # scala_3 job. Scope the run to the JVM/JS projects instead.
      run: >
        sbt ++2.12.21
        scalamockJVM/test scalamockJS/test
        scalamock-zioJVM/test scalamock-zioJS/test
        scalamock-cats-effectJVM/test scalamock-cats-effectJS/test
        scalamock-specs2-4JVM/test scalamock-specs2-4JS/test
        scalamock-scalatestJVM/test scalamock-scalatestJS/test

  scala_2_13:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 17.0.21+9
        force-download: true
        distribution: 'temurin'
    - uses: sbt/setup-sbt@v1
    - name: Run tests
      # See comment in scala_2_12 job: Scala Native is Scala 3 only.
      run: >
        sbt ++2.13.18
        scalamockJVM/test scalamockJS/test
        scalamock-zioJVM/test scalamock-zioJS/test
        scalamock-cats-effectJVM/test scalamock-cats-effectJS/test
        scalamock-specs2-4JVM/test scalamock-specs2-4JS/test
        scalamock-scalatestJVM/test scalamock-scalatestJS/test

  scala_3:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17.0.21+9
          force-download: true
          distribution: 'temurin'
      - uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt ++3.9.0 test
