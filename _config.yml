# Site settings
title: scalamock
description: "Native scala mocking"
baseurl: "" #important: start with /
url: "https://scalamock.org"

# Build settings
markdown: kramdown
permalink: /:categories/:title
excerpt_separator: <!--more--> #use this in posts to define how long the excerpt of the post (that is shown on the Blog page) is

# Enable plugins
plugins:
  - jekyll-remote-theme

# Theme settings
remote_theme: just-the-docs/just-the-docs

# No logo in the sidebar - using site title only

# Disable GitHub metadata to fix the error
github: [metadata]
repository: paulbutcher/scalamock

# Disable edit links completely
gh_edit_link: false

# Just the Docs settings
color_scheme: light
search_enabled: true

# Heading anchor links appear on hover over h1-h6 tags
heading_anchors: true

# Aux links for the upper right navigation
aux_links:
  "scalamock on GitHub":
    - "//github.com/paulbutcher/scalamock"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Enable copy button on code blocks
enable_copy_code_button: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Copyright &copy; 2011-2025 scalamock contributors. Distributed under the MIT License."

# We're using the docs directory structure

# Configure callouts
callouts:
  note:
    title: Note
    color: yellow
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: blue
  tip:
    title: Tip
    color: purple
  new:
    title: New
    color: green
